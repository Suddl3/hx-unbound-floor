name: pages

# Publishes the HX Unbound Floor builder page (floor-web/) with the files its in-browser build runs
# (helix-floor/floor, helix-floor/names, tools/) and the capture converter (web/), in the repository's own layout:
# the site root forwards to floor-web/. Manual only; GitHub Pages must be set to "GitHub Actions" in the settings.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}floor-web/
    steps:
      - uses: actions/checkout@v4
      - name: site
        run: |
          mkdir -p _site
          cp -r web floor-web tools LICENSE NOTICE _site/
          mkdir -p _site/helix-floor
          cp -r helix-floor/floor helix-floor/names _site/helix-floor/
          find _site -name __pycache__ -prune -exec rm -rf {} +
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=floor-web/"><title>HX Unbound Floor</title><a href="floor-web/">HX Unbound Floor</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
